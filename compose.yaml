services:
  app:
    build: .
    ports:
      - '8000:8000'
    depends_on:
      - db

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: violations
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data: